<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理信息系统 · 智能体助教实验平台</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="brand-mark">MIS</div>
        <div>
          <h1>智能体助教<br />实验平台</h1>
          <p>数据库设计 · 系统规划</p>
        </div>
      </div>

      <div class="nav-label">实验导航</div>
      <button class="nav-item on" data-page="home"><span class="idx">◇</span>实验总览</button>
      <button class="nav-item" data-page="dfd"><span class="idx">1</span>制作数据流图</button>
      <button class="nav-item" data-page="sql"><span class="idx">2</span>学习 SQL 语句</button>
      <button class="nav-item" data-page="bpm"><span class="idx">3</span>分析业务流程</button>
      <div class="nav-label">助教与报告</div>
      <button class="nav-item" data-page="report"><span class="idx">▤</span>学习报告</button>

      <div class="nav-spacer"></div>
      <div class="side-foot">
        <label for="stuName">学生姓名（用于报告）</label>
        <input id="stuName" placeholder="请输入姓名 / 学号" />
      </div>
    </aside>

    <main class="main" id="main"></main>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/sql-engine.js"></script>
  <script src="assets/lab-dfd.js"></script>
  <script src="assets/lab-sql.js"></script>
  <script src="assets/lab-bpm-draw.js"></script>
  <script src="assets/lab-bpm.js"></script>
  <!-- 云服务 SDK（本地打包的 IIFE，暴露全局 WorkBuddyCloud） -->
  <script src="assets/vendor/workbuddy-cloud-sdk.global.js"></script>
  <script src="assets/cloud.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
